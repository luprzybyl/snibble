name: Build APK

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'requirements.txt'
      - '.github/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [armeabi-v7a, arm64-v8a]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libffi-dev libssl-dev cmake zip unzip

      - name: Install buildozer
        run: pip install --upgrade buildozer cython

      - name: Cache buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ matrix.arch }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: buildozer-${{ matrix.arch }}-

      - name: Select arch in buildozer.spec
        run: sed -i "s/^android\.archs = .*/android.archs = ${{ matrix.arch }}/" buildozer.spec

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: bin/*.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from buildozer.spec
        id: ver
        run: echo "v=$(grep -oP '^version = \K.*' buildozer.spec)" >> "$GITHUB_OUTPUT"

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-b${{ github.run_number }}
          name: Snibble ${{ steps.ver.outputs.v }} (build ${{ github.run_number }})
          files: dist/*.apk
          generate_release_notes: true
