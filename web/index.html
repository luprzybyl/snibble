<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snibble</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#2c4a1e;
    font-family: system-ui, sans-serif; touch-action:none; }
  #cv { display:block; width:100%; height:100%; }
  #menu, #dead {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:rgba(20,35,15,.82); color:#fff; z-index:10;
  }
  #dead { display:none; }
  #menu h1 { font-size:64px; margin:0; letter-spacing:2px; }
  #name { font-size:24px; padding:8px 14px; border-radius:8px;
    border:none; text-align:center; width:200px; }
  #mods { display:flex; gap:14px; font-size:15px; }
  #mods label { display:flex; align-items:center; gap:4px; cursor:pointer; }
  .btn { font-size:28px; padding:10px 40px; border-radius:12px; border:none;
    background:#3aaa3a; color:#fff; cursor:pointer; }
  .btn:active { transform:scale(.96); }
  #load { position:fixed; inset:0; display:flex; align-items:center;
    justify-content:center; color:#dfe; font-size:20px; z-index:20;
    background:#2c4a1e; flex-direction:column; gap:10px; }
  #rank { position:fixed; top:10px; right:10px; color:#fff;
    background:rgba(0,0,0,.45); border-radius:8px; padding:8px 12px;
    font-size:13px; line-height:1.5; z-index:5; white-space:pre; }
  #boost { position:fixed; right:24px; bottom:24px; width:96px; height:96px;
    border-radius:50%; border:4px solid #7a4a10; background:#f0932b;
    color:#fff; font-size:44px; z-index:5; user-select:none; }
  #boost.on { background:#ff5b00; }
  #zoom { position:fixed; left:24px; bottom:24px; display:flex; gap:10px; z-index:5; }
  #zoom button { width:52px; height:52px; border-radius:50%; font-size:26px;
    border:none; background:rgba(0,0,0,.5); color:#fff; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="rank" class="hidden"></div>
<button id="boost" class="hidden">&#9889;</button>
<div id="zoom" class="hidden">
  <button id="zin">+</button><button id="zout">&minus;</button>
</div>
<div id="dead">
  <div id="deadscore" style="font-size:26px"></div>
  <button class="btn" id="retry">&#8635;</button>
  <button class="btn" id="tomenu" style="font-size:16px;padding:8px 24px">MENU</button>
</div>
<div id="menu">
  <h1>SNIBBLE</h1>
  <input id="name" maxlength="12" placeholder="name" value="You">
  <div id="mods">
    <label><input type="checkbox" id="m-castles" checked>&#127984;</label>
    <label><input type="checkbox" id="m-cannons">&#128163;</label>
    <label><input type="checkbox" id="m-frogs" checked>&#128056;</label>
    <label><input type="checkbox" id="m-portals">&#128371;</label>
  </div>
  <button class="btn" id="play">&#9654;</button>
</div>
<div id="load">loading python runtime&hellip;<div id="loadmsg"></div></div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<script src="game.js"></script>
</body>
</html>
